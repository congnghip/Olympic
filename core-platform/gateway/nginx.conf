# ==============================================================
# DX-OS Open-Core: API Gateway & Reverse Proxy Configuration
# Tầng 1: Cửa ngõ API kiểm soát biên mạng & điều hướng dịch vụ
# ==============================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    upstream map_dispatcher_upstream {
        server 127.0.0.1:8502;
    }

    upstream analytics_upstream {
        server 127.0.0.1:8501;
    }

    upstream api_solver_upstream {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Trung tâm Điều hành WebGIS (IOC) - Port 8502
        location / {
            proxy_pass http://map_dispatcher_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. Cổng API Backend & Solver - Port 8000
        location /api/solver/ {
            proxy_pass http://api_solver_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 3. Phân Hệ Phân Tích & Nghiên Cứu - Port 8501
        location /analytics/ {
            proxy_pass http://analytics_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
