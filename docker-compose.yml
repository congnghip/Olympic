services:
  waste-routing-platform:
    build: .
    container_name: waste-routing-app
    image: waste-routing-app:latest
    ports:
      - "8000:8000"  # Core Solver API & Dispatcher API (FastAPI)
      - "8501:8501"  # Parameter Tuning & Sensitivity Analytics (Streamlit)
      - "8502:8502"  # Real-time WebGIS Waste Dispatcher & Dual-Map UI
    volumes:
      - ./map_ui:/app/map_ui
      - ./streamlit:/app/streamlit
      - ./backend:/app/backend
      - ./src/data:/app/src/data
      - ./start.sh:/app/start.sh
    environment:
      - HOST=0.0.0.0
      - FASTAPI_PORT=8000
      - STREAMLIT_PORT=8501
      - MAP_UI_PORT=8502
    restart: unless-stopped
